[package]
name = "fruity-studio"
version = "0.1.0"
description = "Fruity Studio - studio local de production de videos de personnages fruits"
authors = ["Fruity Studio"]
edition = "2024"

[lib]
# Le suffixe `_lib` evite un conflit de nom entre la lib et le binaire sous Windows.
name = "fruity_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` : vues web multiples dans une fenetre (TikTok et YouTube dans Mes reseaux).
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset"] }
sha2 = "0.10"
imagesize = "0.15"
# Extraction de l'archive FFmpeg (installation automatique) ; inflate en Rust pur.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

# Le hachage SHA-256 (deduplication des medias) reste rapide meme en build debug.
[profile.dev.package.sha2]
opt-level = 3

# Extraction de l'archive FFmpeg : rapide aussi avec `tauri dev`.
[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zip]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
